name: Tests

# Both suites are dependency-free, so they run fast and catch broken
# authorization or validation before anything is deployed.
#
# Every job runs in three timezones. UTC is what the deployed app uses, and the
# other two sit fourteen and eleven hours away from it in opposite directions;
# with them in place a rule that falls back to the machine's local calendar day
# fails here instead of in production, where the two halves would silently
# disagree around midnight.

on:
  push:
  pull_request:

jobs:
  app:
    name: Web app rules and routes (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ["UTC", "Pacific/Kiritimati", "Pacific/Midway"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

  desktop:
    name: Desktop rules (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ["UTC", "Pacific/Kiritimati", "Pacific/Midway"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The desktop app is standard library only, so there is nothing to install.
      # These tests never open a window, so no display or tkinter is needed.
      - name: Run tests
        run: python -m unittest discover -s tests -v
