name: Tests

# Both suites are dependency-free, so they run fast and catch broken
# authorization or validation before anything is deployed.

on:
  push:
  pull_request:

jobs:
  app:
    name: Web app rules and routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

  desktop:
    name: Desktop rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The desktop app is standard library only, so there is nothing to install.
      # These tests never open a window, so no display or tkinter is needed.
      - name: Run tests
        run: python -m unittest discover -s tests -v
