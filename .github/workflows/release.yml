name: Build desktop release

# Builds BloodConnect.exe on Windows and BloodConnect.app on macOS, then
# attaches both to a GitHub release. PyInstaller cannot cross-compile, so each
# platform is built on its own runner.
#
# Every push to main builds both platforms and uploads the artifacts, so a
# broken build shows up before a version is tagged. Publishing is limited to
# v* tags and manual runs:
#   Actions -> "Build desktop release" -> Run workflow, or:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BloodConnect-windows.exe
          - os: macos-latest
            asset: BloodConnect-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.0"

      # build.py checks the Python floor and that tkinter is present before
      # building, so a Tk-less runner fails with an explanation instead of
      # producing a bundle that cannot open a window.
      - name: Build the app
        run: python build.py

      - name: Package the macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/BloodConnect.app ${{ matrix.asset }}

      - name: Package the Windows executable
        if: runner.os == 'Windows'
        run: copy dist\BloodConnect.exe ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # A push to main only verifies that both platforms build; it must not
    # publish anything. Releases come from a v* tag or a manual run.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          files=(BloodConnect-windows.exe BloodConnect-macos.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its files."
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" \
              --title "Blood Connect $TAG" \
              --notes "Standalone builds of Blood Connect. Windows: unzip and run BloodConnect.exe. macOS: unzip and open BloodConnect.app (right-click, then Open, the first time)." \
              "${files[@]}"
          fi
